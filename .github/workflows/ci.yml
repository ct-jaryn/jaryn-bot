name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show version
        run: node -v && npm -v
      - name: Link internal workspaces
        run: node scripts/link-workspaces.mjs
      - name: Tests
        run: npm test
      - name: Docs / deploy / eval checks
        run: npm run check
      - name: Desktop unit tests
        run: node --test desktop/test/*.test.cjs
