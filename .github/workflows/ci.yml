name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show version
        run: node -v && npm -v
      - name: Install root (workspace links are resolved at runtime)
        run: npm install --no-audit --no-fund --ignore-scripts || true
      - name: Tests
        run: npm test
      - name: Docs / deploy / eval checks
        run: npm run check
      - name: Desktop unit tests
        run: node --test desktop/test/*.test.cjs
