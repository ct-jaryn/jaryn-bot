name: release

# 免费打包机制：公开仓库使用 GitHub 托管的标准 runner（public repo 不计分钟）。
# - push tag v*        → 构建全部客户端并创建/更新 GitHub Release（附 SHA256SUMS）
# - workflow_dispatch  → 构建并上传 workflow artifacts（不创建 Release）
# - schedule（每周一）  → 同上，作为"快照构建"，尽早发现打包链路断裂
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (tests + checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/link-workspaces.mjs
      - run: npm test
      - run: npm run check
      - name: Verify CLI boots
        run: node packages/cli/src/index.ts doctor --home "$RUNNER_TEMP/jary-home"

  desktop:
    name: desktop (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          # macos-15 = arm64；package.json 里 dmg 目标为 x64+arm64，交叉构建
          - os: macos-15
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-main.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building desktop $VERSION (${{ matrix.target }})"

      - name: Cache electron / electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Set package version from tag
        shell: bash
        run: npm pkg set version="$VERSION"

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p ../artifacts/desktop
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "no installer produced"; exit 1; fi
          for f in "${files[@]}"; do cp "$f" "../artifacts/desktop/"; done
          ls -lh ../artifacts/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/desktop/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (apk)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-main.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp version into the Android manifest
        working-directory: mobile/android
        shell: bash
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]\+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          grep -E 'versionName|versionCode' app/build.gradle.kts

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts/android
          cp mobile/android/app/build/outputs/apk/debug/*.apk "artifacts/android/jaryn-$VERSION-debug.apk"
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish (release / artifacts)
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-main.${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten and checksum
        shell: bash
        run: |
          mkdir -p dist
          find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "---"
          ls -lh

      - name: Upload checksummed bundle
        uses: actions/upload-artifact@v4
        with:
          name: jaryn-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/release-notes.ts "${{ steps.version.outputs.version }}" > release-notes.md && head -20 release-notes.md

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: jaryn-bot v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
