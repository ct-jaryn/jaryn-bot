<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jaryn-bot</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <h1>jaryn</h1>
    <button id="new-session">+ 新会话</button>
    <select id="bot-select" title="选择 Bot"></select>
    <ul id="sessions"></ul>
    <footer>v1.13 · self-hosted</footer>
  </aside>
  <main>
    <header>
      <span id="session-label">web</span>
      <span id="status" class="idle">idle</span>
      <span class="spacer"></span>
      <button id="stop-btn" class="ghost">停止</button>
      <button id="notify-btn" class="ghost">通知 <span id="notify-count">0</span></button>
      <button id="panel-toggle" class="ghost">面板</button>
      <button id="screen-toggle" class="ghost">看屏</button>
    </header>
    <section id="screen-panel" hidden>
      <img id="screen-img" alt="bot screen" />
      <div class="screen-controls">
        <button id="takeover-btn" class="ghost">接管</button>
        <input id="screen-text" placeholder="输入文字后发送" />
        <button id="screen-send">输入</button>
        <span id="screen-tip">点击画面 = 点击网页；接管时 Bot 暂停</span>
      </div>
    </section>
    <section id="messages"></section>
    <section id="questions"></section>
    <section id="approvals"></section>
    <form id="composer">
      <textarea id="input" rows="2" placeholder="派活给 jaryn…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button type="submit">发送</button>
    </form>
  </main>
  <aside id="panels" hidden>
    <div class="tabs">
      <button data-tab="memory" class="tab active">记忆</button>
      <button data-tab="tasks" class="tab">任务</button>
      <button data-tab="pages" class="tab">页面</button>
      <button data-tab="artifacts" class="tab">产物</button>
      <button data-tab="jobs" class="tab">例程</button>
      <button data-tab="initiative" class="tab">提议</button>
      <button data-tab="usage" class="tab">用量</button>
      <button data-tab="audit" class="tab">审计</button>
      <button data-tab="notifications" class="tab">通知</button>
    </div>
    <div id="panel-body"></div>
  </aside>
  <script type="module" src="/app.js"></script>
</body>
</html>
