<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>jaryn · 连接服务器</title>
  <style>
    body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0f1115; color:#e6e8ee; max-width:460px; margin:10vh auto; padding:0 24px; }
    h1 { font-size:18px; }
    label { display:block; margin:14px 0 6px; color:#8b93a7; }
    input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid #2a2f3a; background:#171a21; color:#e6e8ee; }
    button { margin-top:18px; width:100%; padding:10px; border:0; border-radius:8px; background:#5b8cff; color:#fff; cursor:pointer; font-size:15px; }
    p.hint { color:#8b93a7; font-size:12px; }
    p.error { color:#ff8a8a; }
  </style>
</head>
<body>
  <h1>连接你的 jaryn 服务器</h1>
  <p class="hint">输入自托管服务的地址，例如 http://192.168.1.10:8787 或 https://bot.example.com。若服务端设置了 JARY_API_TOKEN，请一并填写。</p>
  <label>服务器地址</label>
  <input id="url" placeholder="http://127.0.0.1:8787" />
  <label>API Token（可选）</label>
  <input id="token" type="password" placeholder="若服务端设置了 JARY_API_TOKEN 则必填" />
  <button id="save">保存并连接</button>
  <p class="error" id="error"></p>
  <script>
    const $ = (id) => document.getElementById(id)
    window.jarynDesktop.getConfig().then((cfg) => { $('url').value = cfg.serverUrl || '' })
    $('save').onclick = async () => {
      $('error').textContent = ''
      try {
        await window.jarynDesktop.setConfig($('url').value, $('token').value)
      } catch (err) {
        $('error').textContent = err.message || String(err)
      }
    }
  </script>
</body>
</html>
